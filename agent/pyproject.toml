[project]
name = "simple-agent-template"
version = "0.1.0"
description = "Minimal LangChain agent template for LangSmith/LangGraph deployment"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.143.0",
    "fastmcp>=4.1.0",
    "langchain>=1.3.10",
    "langchain-anthropic>=1.4.6",
    "langchain-aws>=0.2.15",
    "langchain-google-genai>=4.4.0",
    "langchain-mcp-adapters>=0.3.1",
    "langgraph>=1.0.0",
    "mcp>=2.3.0",
    "nest-asyncio>=1.6.0",
    "pillow>=12.3.0",
    "python-dotenv>=1.0.1",
]

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anyio>=4.7.0",
    "langgraph-cli[inmem]>=0.4.10",
    "pytest>=9.0.3",
    "ruff>=0.8.0",
]

[tool.uv.build-backend]
module-name = ["beacon_agent", "beacon_hub", "smarthome_mcp", "tiago_mcp"]
source-include = ["langgraph.json", ".env.example", "Makefile", "tests/**"]

[tool.pyright]
extraPaths = [
    "C:\\Users\\fullendmaestro\\AppData\\Local\\Programs\\Webots\\lib\\controller\\python",
    "src/simulation/controllers/tiago_home_controller",
]
